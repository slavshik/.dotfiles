# \u0002 = ctrl+b = herdr prefix (same byte as the old tmux prefix).
# herdr defaults are the source of truth; this file only maps CMD keys onto
# herdr's prefix chords. See herdr/config.toml for the contract.
[keyboard]
bindings = [
    { key = "S", mods = "Command", chars = "\u001B:w\n" }, # save command
    { key = "W", mods = "Command", chars = "\u0002x" }, # close pane (herdr close_pane)
    { key = "N", mods = "Command|Shift", chars = "\u0002N" }, # new herdr workspace
    { key = "T", mods = "Command", chars = "\u0002c" }, # new herdr tab
    { key = "G", mods = "Command", chars = " K" }, # open lazygit
    { key = "H", mods = "Command|Shift", chars = "\u0002H" }, # resize herdr pane left
    { key = "L", mods = "Command|Shift", chars = "\u0002L" }, # resize herdr pane right
    { key = "J", mods = "Command|Shift", chars = "\u0002J" }, # resize herdr pane down
    { key = "K", mods = "Command|Shift", chars = "\u0002K" }, # resize herdr pane up
    { key = "H", mods = "Command", chars = "\u0002h" }, # nav left  (herdr pane; does NOT hand off to nvim splits) — ⌘H freed from macOS "Hide" via defaults_write.sh
    { key = "J", mods = "Command", chars = "\u0002j" }, # nav down  (herdr pane; does NOT hand off to nvim splits)
    { key = "K", mods = "Command", chars = "\u0002k" }, # nav up    (herdr pane; does NOT hand off to nvim splits)
    { key = "L", mods = "Command", chars = "\u0002l" }, # nav right (herdr pane; does NOT hand off to nvim splits)
    # C-j/C-k normally send 0x0A — indistinguishable from Enter in nvim.
    # CSI-u lets nvim bind <C-j>/<C-k> (smart-splits split navigation).
    { key = "J", mods = "Control", chars = "\u001B[106;5u" },
    { key = "K", mods = "Control", chars = "\u001B[107;5u" },
    { key = "Z", mods = "Command", chars = "\u001Bu" }, # undo in vim (u)
    { key = "Z", mods = "Command|Shift", chars = "\u001B\u0012"}, # redo in vim (^R)

    { key = "Slash", mods = "Command", chars = "gcc" }, # comment line 
    { key = "Slash", mods = "Command|Alt", chars = "gb" }, # comment out block

    { key = "|", mods="Command|Shift", chars = "\u0002w" }, # herdr workspace picker
    { key = "LBracket", mods = "Command", chars = "\u0002p" }, # CMD+[ -> previous tab (herdr tab)
    { key = "RBracket", mods = "Command", chars = "\u0002n" }, # CMD+] -> next tab (herdr tab)
    { key = "{", mods="Command|Shift", chars = "\u0002(" }, # CMD+Shift+[ -> previous workspace
    { key = "}", mods="Command|Shift", chars = "\u0002)" }, # CMD+Shift+] -> next workspace
    { key = "T", mods = "Command|Shift", chars = "\u0002v" }, # split pane vertical (left/right)
    { key = "S", mods = "Command|Shift", chars = "\u0002-" }, # split pane horizontal (top/bottom)
    { key = "!", mods = "Command|Shift", chars = " !@f" }, # open file in Finder

    { key = "E", mods = "Command", chars = " e" },
    # NO HERDR EQUIVALENT (tmux break-pane; prefix+e is edit_scrollback): { key = "E", mods = "Command|Shift", chars = "\u0002e" },
    { key = "M", mods = "Command|Shift", chars = " MM" },
    { key = "B", mods = "Command", chars = "gd" },
    { key = "P", mods = "Command|Shift", chars = " T" },
    { key = "O", mods = "Command", chars = " o" },
    { key = "O", mods = "Command|Shift", chars = " lf" }, # open lf browser
    { key = "Return", mods = "Alt", chars = ">" },
    { key = "Return", mods = "Alt|Shift", chars = "<" },
    { key = "D", mods = "Command", chars = "\u0002q" },
    { key = "R", mods = "Command", chars = "_run\n" },
    { key = "F", mods = "Command|Shift", chars = " FF" },
    { key = "O", mods = "Control|Alt", chars = " OI" }, # optimize imports (leader+OI -> nvim)
    { key = "I", mods = "Command", chars = " II" }, # npm_install script
    { key = "I", mods = "Command|Shift", chars = " ii" }, # yarnrun script
    { key = "K", mods = "Command|Control", chars = "\u0002g" }, # herdr goto (sesh was tmux-only and no longer applies)

    { key = ".", mods = "Command", chars = "\u0002." }, # move tab right
    { key = ",", mods = "Command", chars = "\u0002," }, # move tab left
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "H", mods = "Command|Alt", chars = "\u0002\u001B[1;2D" }, # swap pane left
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "J", mods = "Command|Alt", chars = "\u0002\u001B[1;2B" }, # swap pane down
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "K", mods = "Command|Alt", chars = "\u0002\u001B[1;2A" }, # swap pane up
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "L", mods = "Command|Alt", chars = "\u0002\u001B[1;2C" }, # swap pane right

    # -------------------------------------------------------------
    # 
    # 
    # -------------------------------------------------------------
    { key = "F1", mods = "Shift", chars = "\u001B[1;2P" },
    { key = "F2", mods = "Shift", chars = "\u001B[1;2Q" },
    { key = "F3", mods = "Shift", chars = "\u001B[1;2R" },
    { key = "F4", mods = "Shift", chars = "\u001B[1;2S" },
    { key = "F5", mods = "Shift", chars = "\u001B[15;2~" },
    { key = "F6", mods = "Shift", chars = "\u001B[17;2~" },
    { key = "F7", mods = "Shift", chars = "\u001B[18;2~" },
    { key = "F8", mods = "Shift", chars = "\u001B[19;2~" },
    { key = "F9", mods = "Shift", chars = "\u001B[20;2~" },
    { key = "F10", mods = "Shift", chars = "\u001B[21;2~" },
    { key = "F11", mods = "Shift", chars = "\u001B[23;2~" },
    { key = "F12", mods = "Shift", chars = "\u001B[24;2~" },
    { key = "F1", mods = "Control", chars = "\u001B[1;5P" },
    { key = "F2", mods = "Control", chars = "\u001B[1;5Q" },
    { key = "F3", mods = "Control", chars = "\u001B[1;5R" },
    { key = "F4", mods = "Control", chars = "\u001B[1;5S" },
    { key = "F5", mods = "Control", chars = "\u001B[15;5~" },
    { key = "F6", mods = "Control", chars = "\u001B[17;5~" },
    { key = "F7", mods = "Control", chars = "\u001B[18;5~" },
    { key = "F8", mods = "Control", chars = "\u001B[19;5~" },
    { key = "F9", mods = "Control", chars = "\u001B[20;5~" },
    { key = "F10", mods = "Control", chars = "\u001B[21;5~" },
    { key = "F11", mods = "Control", chars = "\u001B[23;5~" },
    { key = "F12", mods = "Control", chars = "\u001B[24;5~" },
    { key = "F1", mods = "Alt", chars = "\u001B[1;6P" },
    { key = "F2", mods = "Alt", chars = "\u001B[1;6Q" },
    { key = "F3", mods = "Alt", chars = "\u001B[1;6R" },
    { key = "F4", mods = "Alt", chars = "\u001B[1;6S" },
    { key = "F5", mods = "Alt", chars = "\u001B[15;6~" },
    { key = "F6", mods = "Alt", chars = "\u001B[17;6~" },
    { key = "F7", mods = "Alt", chars = "\u001B[18;6~" },
    { key = "F8", mods = "Alt", chars = "\u001B[19;6~" },
    { key = "F9", mods = "Alt", chars = "\u001B[20;6~" },
    { key = "F10", mods = "Alt", chars = "\u001B[21;6~" },
    { key = "F11", mods = "Alt", chars = "\u001B[23;6~" },
    { key = "F12", mods = "Alt", chars = "\u001B[24;6~" },
    { key = "F1", mods = "Super", chars = "\u001B[1;3P" },
    { key = "F2", mods = "Super", chars = "\u001B[1;3Q" },
    { key = "F3", mods = "Super", chars = "\u001B[1;3R" },
    { key = "F4", mods = "Super", chars = "\u001B[1;3S" },
    { key = "F5", mods = "Super", chars = "\u001B[15;3~" },
    { key = "F6", mods = "Super", chars = "\u001B[17;3~" },
    { key = "F7", mods = "Super", chars = "\u001B[18;3~" },
    { key = "F8", mods = "Super", chars = "\u001B[19;3~" },
    { key = "F9", mods = "Super", chars = "\u001B[20;3~" },
    { key = "F10", mods = "Super", chars = "\u001B[21;3~" },
    { key = "F11", mods = "Super", chars = "\u001B[23;3~" },
    { key = "F12", mods = "Super", chars = " ds" }, # lsp_document_symbols (leader+ds)
    # ----------------------------------------------------
    # -------- tabs in herdr ----------------------------
    { key = "Key1", mods = "Command", chars = "\u00021" },
    { key = "Key2", mods = "Command", chars = "\u00022" },
    { key = "Key3", mods = "Command", chars = "\u00023" },
    { key = "Key4", mods = "Command", chars = "\u00024" },
    { key = "Key5", mods = "Command", chars = "\u00025" },
    { key = "Key6", mods = "Command", chars = "\u00026" },
    { key = "Key7", mods = "Command", chars = "\u00027" },
    { key = "Key8", mods = "Command", chars = "\u00028" },
    { key = "Key9", mods = "Command", chars = "\u00029" },

    # ╔══ RUSSIAN LAYOUT SECTION ═════════════════════════════════════════════════╗
    # ║  Alacritty 0.13+ matches `key` by logical character (layout-dependent).   ║
    # ║  In Russian layout physical keys send Cyrillic: H->р J->о K->л L->д       ║
    # ║  Each EN binding above has a RU duplicate here with identical `chars`.     ║
    # ║  Key map: s->ы w->ц n->т t->е g->п h->р j->о k->л l->д z->я              ║
    # ║           e->у d->в r->к b->и o->щ m->ь p->з f->а i->ш .->ю ,->б         ║
    # ║  ADD / CHANGE / REMOVE an EN binding above -> update its RU pair here.     ║
    # ╚════════════════════════════════════════════════════════════════════════════╝
    { key = "ы", mods = "Command", chars = "\u001B:w\n" }, # save command
    { key = "ц", mods = "Command", chars = "\u0002x" }, # close pane (herdr close_pane)
    { key = "т", mods = "Command|Shift", chars = "\u0002N" }, # new herdr workspace
    { key = "е", mods = "Command", chars = "\u0002c" }, # new herdr tab
    { key = "п", mods = "Command", chars = " K" }, # open lazygit
    { key = "р", mods = "Command|Shift", chars = "\u0002H" }, # resize herdr pane left
    { key = "д", mods = "Command|Shift", chars = "\u0002L" }, # resize herdr pane right
    { key = "о", mods = "Command|Shift", chars = "\u0002J" }, # resize herdr pane down
    { key = "л", mods = "Command|Shift", chars = "\u0002K" }, # resize herdr pane up
    { key = "р", mods = "Command", chars = "\u0002h" }, # nav left  (herdr pane; does NOT hand off to nvim splits) — ⌘H freed from macOS "Hide" via defaults_write.sh
    { key = "о", mods = "Command", chars = "\u0002j" }, # nav down  (herdr pane; does NOT hand off to nvim splits)
    { key = "л", mods = "Command", chars = "\u0002k" }, # nav up    (herdr pane; does NOT hand off to nvim splits)
    { key = "д", mods = "Command", chars = "\u0002l" }, # nav right (herdr pane; does NOT hand off to nvim splits)
    { key = "о", mods = "Control", chars = "\u001B[106;5u" },  # RU: J
    { key = "л", mods = "Control", chars = "\u001B[107;5u" },  # RU: K
    { key = "я", mods = "Command", chars = "\u001Bu" }, # undo in vim (u)
    { key = "я", mods = "Command|Shift", chars = "\u001B\u0012"}, # redo in vim (^R)
    { key = "е", mods = "Command|Shift", chars = "\u0002v" }, # split pane vertical (left/right)
    { key = "ы", mods = "Command|Shift", chars = "\u0002-" }, # split pane horizontal (top/bottom)
    { key = "у", mods = "Command", chars = " e" },  # RU: E
    # NO HERDR EQUIVALENT (tmux break-pane; prefix+e is edit_scrollback): { key = "у", mods = "Command|Shift", chars = "\u0002e" },  # RU: E
    { key = "ь", mods = "Command|Shift", chars = " MM" },  # RU: M
    { key = "и", mods = "Command", chars = "gd" },  # RU: B
    { key = "з", mods = "Command|Shift", chars = " T" },  # RU: P
    { key = "щ", mods = "Command", chars = " o" },  # RU: O
    { key = "щ", mods = "Command|Shift", chars = " lf" }, # open lf browser
    { key = "в", mods = "Command", chars = "\u0002q" },  # RU: D
    { key = "к", mods = "Command", chars = "_run\n" },  # RU: R
    { key = "а", mods = "Command|Shift", chars = " FF" },  # RU: F
    { key = "щ", mods = "Control|Alt", chars = " OI" }, # optimize imports (leader+OI -> nvim)
    { key = "ш", mods = "Command", chars = " II" }, # npm_install script
    { key = "ш", mods = "Command|Shift", chars = " ii" }, # yarnrun script
    { key = "л", mods = "Command|Control", chars = "\u0002g" }, # herdr goto (sesh was tmux-only and no longer applies)
    { key = "ю", mods = "Command", chars = "\u0002." }, # move tab right
    { key = "б", mods = "Command", chars = "\u0002," }, # move tab left
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "р", mods = "Command|Alt", chars = "\u0002\u001B[1;2D" }, # swap pane left
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "о", mods = "Command|Alt", chars = "\u0002\u001B[1;2B" }, # swap pane down
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "л", mods = "Command|Alt", chars = "\u0002\u001B[1;2A" }, # swap pane up
    # NO HERDR EQUIVALENT (tmux swap-pane): { key = "д", mods = "Command|Alt", chars = "\u0002\u001B[1;2C" }, # swap pane right
    { key = "х", mods = "Command", chars = "\u0002p" }, # CMD+[ -> previous tab (herdr tab)  # RU: [
    { key = "ъ", mods = "Command", chars = "\u0002n" }, # CMD+] -> next tab (herdr tab)  # RU: ]
    { key = "Х", mods="Command|Shift", chars = "\u0002(" }, # CMD+Shift+[ -> previous workspace
    { key = "Ъ", mods="Command|Shift", chars = "\u0002)" }, # CMD+Shift+] -> next workspace
]
